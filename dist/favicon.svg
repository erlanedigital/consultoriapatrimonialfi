      <stop offset="0%" stop-color="#6E1A2B"/>
      <stop offset="100%" stop-color="#3D0C16"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E4C98E"/>
      <stop offset="50%" stop-color="#C9A86A"/>
      <stop offset="100%" stop-color="#9C7738"/>
